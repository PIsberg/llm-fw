repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.16.3
  hooks:
  - id: gitleaks
- repo: local
  hooks:
  - id: typecheck
    name: TypeScript type-check
    entry: npx tsc --noEmit
    language: system
    types_or: [ts, javascript]
    pass_filenames: false
  - id: lint
    name: Static analysis (ESLint + SonarJS, Oxlint, Biome)
    entry: npm run lint
    language: system
    types_or: [ts, javascript, json]
    pass_filenames: false
  - id: knip
    name: Unused exports and dependencies (Knip)
    entry: npm run knip
    language: system
    types_or: [ts, javascript, json]
    pass_filenames: false
  - id: audit
    name: Dependency vulnerability audit (npm audit)
    entry: npm run audit
    language: system
    files: ^package(-lock)?\.json$
    pass_filenames: false
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
