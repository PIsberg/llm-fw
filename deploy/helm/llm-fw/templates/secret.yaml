{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-fw.fullname" . }}
  labels:
    {{- include "llm-fw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.gatewayToken }}
  LLM_FW_GATEWAY_TOKEN: {{ .Values.secrets.gatewayToken | quote }}
  {{- end }}
  {{- if .Values.secrets.dashboardToken }}
  LLM_FW_DASHBOARD_TOKEN: {{ .Values.secrets.dashboardToken | quote }}
  {{- end }}
  {{- range $slug, $key := .Values.secrets.providerKeys }}
  LLM_FW_GATEWAY_KEY_{{ $slug | upper }}: {{ $key | quote }}
  {{- end }}
{{- end }}
