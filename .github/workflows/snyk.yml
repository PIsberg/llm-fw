name: Snyk

on:
  push:
    branches-ignore: [gh-pages, 'dependabot/**']
  pull_request:
    branches-ignore: [gh-pages]

permissions:
  contents: read

jobs:
  snyk:
    name: Vulnerability & logic flaws (Snyk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The secrets context is not allowed in `if:`, and a condition on it makes GitHub
    # reject the whole file at startup. Only whether it is set goes to env; the
    # secret itself stays on the one step that uses it.
    env:
      HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Skip when secret is absent
        if: ${{ env.HAS_SNYK_TOKEN != 'true' }}
        run: echo "SNYK_TOKEN secret is not configured; skipping Snyk vulnerability scan."

      - name: Run Snyk scan
        if: ${{ env.HAS_SNYK_TOKEN == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx --yes snyk@1.1308.3 test
