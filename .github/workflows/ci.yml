name: CI

on:
  push:
    # release/** matters as much as the rest: a release branch outlives its PR.
    # When 0.4.1's PR was merged early, later pushes to the branch stopped
    # triggering `pull_request` and matched nothing here, so two commits sat
    # unverified while `gh pr checks` kept reporting green from the merged SHA.
    #
    # The same trap, second visit: a branch named with any prefix NOT listed
    # here gets no CI at all, silently. A perf/** branch was pushed and opened
    # as a PR and ran nothing. Rather than keep guessing which prefixes people
    # will use, this now matches every branch and excludes the noisy ones.
    branches-ignore: [gh-pages, 'dependabot/**']
  pull_request:
    # Not restricted to main: a stacked PR targets the branch below it, and
    # `pull_request` only fires for the bases listed here. A stacked PR that
    # ran nothing still showed a green tick from its own base's run.
    branches-ignore: [gh-pages]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    # Cache the embedding model independently of the per-run LLM_FW_DIR (which
    # the E2E suites point at a throwaway temp dir). EmbeddingChecker honours
    # LLM_FW_MODEL_DIR, so a warm cache here keeps the semantic stage active in
    # tests; a cold miss degrades gracefully rather than failing.
    env:
      LLM_FW_MODEL_DIR: ${{ github.workspace }}/.hf-model-cache

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.hf-model-cache
          key: llm-fw-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E Tests (Node 22)
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      LLM_FW_MODEL_DIR: ${{ github.workspace }}/.hf-model-cache

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.hf-model-cache
          key: llm-fw-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run E2E tests
        run: npm run test:e2e

  load-test:
    name: Load Tests — Performance & Accuracy (Node 22)
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      LLM_FW_MODEL_DIR: ${{ github.workspace }}/.hf-model-cache

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.hf-model-cache
          key: llm-fw-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Scenario A — Performance (benign-only stress, small CI values)
        run: npm run test:load:perf
        env:
          LOAD_VUS: '3'
          LOAD_DURATION_S: '15'
          LOAD_P99_MS: '8000'

      - name: Scenario B — Accuracy (mixed traffic, small CI values)
        run: npm run test:load:accuracy
        env:
          LOAD_VUS: '3'
          LOAD_ITERATIONS: '20'
          LOAD_FPR_MAX: '2.0'
          LOAD_TPR_MIN: '60.0'

      # Deterministic sweep: every corpus entry exactly once → exact per-class
      # recall. Publishes the scorecard table to the job summary and fails the
      # job on FPR/TPR floor violations (same gate as the script's exit code).
      - name: Scenario C — Detection scorecard (deterministic sweep)
        run: npm run scorecard
        env:
          LOAD_VUS: '3'
          LOAD_FPR_MAX: '2.0'
          LOAD_TPR_MIN: '70.0'

      # Scenario D gates the failure mode the other scenarios cannot see. The
      # scorecard corpus was co-tuned to 100%/0%, so it cannot answer "does this
      # block real benign traffic?"; this runs a HELD-OUT benign corpus weighted
      # toward the shapes that have actually produced false positives here, and
      # fails on the FIRST false positive in any category that currently has
      # none. Recall has always been gated; this is the other half.
      - name: Scenario D — False-positive SLO (held-out benign corpus)
        run: npm run fpr
        env:
          FPR_OUTPUT_FILE: docs/load-results/fpr.json

      - name: Upload false-positive report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: false-positive-report
          path: docs/load-results/fpr.json
          if-no-files-found: ignore

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detection-scorecard
          path: |
            docs/SCORECARD.md
            docs/load-results/scorecard-accuracy.json
          if-no-files-found: ignore
