name: Semgrep
on:
  push:
    branches: ["main"]
  pull_request:
    # NOT restricted to main: `Scan` is a required status check, so a stacked
    # pull request whose base is a feature branch could never satisfy it.
    # This is also how three mutable action tags reached a pull request that
    # was reporting green.
permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Install the Semgrep CLI from PyPI rather than running inside the
      # semgrep/semgrep container. The container approach forced a `docker pull`
      # from Docker Hub on every run, which intermittently fails with registry
      # timeouts / rate limits ("registry-1.docker.io: context deadline
      # exceeded"). PyPI is the more reliable source and removes the Docker Hub
      # dependency entirely.
      #
      # Every package in the tree is pinned by version and sha256 —
      # --require-hashes makes pip refuse anything unpinned, so the resolver
      # cannot quietly pull a different build. See semgrep-requirements.txt for
      # how to regenerate it.
      - name: Install Semgrep
        run: pip install --no-cache-dir --require-hashes -r .github/workflows/semgrep-requirements.txt
      - name: Run Semgrep
        run: semgrep scan --config=p/default --error --metrics=off
