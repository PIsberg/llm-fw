name: Semgrep
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Install the Semgrep CLI from PyPI rather than running inside the
      # semgrep/semgrep container. The container approach forced a `docker pull`
      # from Docker Hub on every run, which intermittently fails with registry
      # timeouts / rate limits ("registry-1.docker.io: context deadline
      # exceeded"). PyPI is the more reliable source and removes the Docker Hub
      # dependency entirely.
      #
      # Every package in the tree is pinned by version and sha256 —
      # --require-hashes makes pip refuse anything unpinned, so the resolver
      # cannot quietly pull a different build. See semgrep-requirements.txt for
      # how to regenerate it.
      - name: Install Semgrep
        run: pip install --no-cache-dir --require-hashes -r .github/workflows/semgrep-requirements.txt
      - name: Run Semgrep
        run: semgrep scan --config=p/default --error --metrics=off
