name: Docker Image

# Builds the image and runs it once, so a base-image bump or a lockfile change
# cannot merge on a CI that never built it. #280 moved every stage to node:23,
# a non-LTS line past end-of-life, on a green CI that had no image build at all
# (#299). Path-filtered: the model-warm stage downloads the embedding model, so
# the job runs when an input to the image changes, not on every PR.

on:
  pull_request:
    branches-ignore: [gh-pages]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'data/**'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'data/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build & Smoke (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runtime stage already fails the build if the ONNX prune broke the
      # embedding stage (see the post-prune check in the Dockerfile).
      - name: Build the image
        run: DOCKER_BUILDKIT=1 docker build --progress=plain -t llm-fw:ci .

      # dockerPinning.test.ts checks the FROM tag statically; this checks the
      # Node the built image actually runs is a major ci.yml's matrix tests.
      - name: Node major is one the CI matrix runs
        run: |
          image_major=$(docker run --rm --entrypoint node llm-fw:ci --version | sed -E 's/^v([0-9]+)\..*/\1/')
          matrix=$(grep -oE 'node-version: \[[0-9, ]+\]' .github/workflows/ci.yml | head -1 | grep -oE '[0-9]+')
          echo "image runs Node $image_major; CI matrix: $(echo $matrix)"
          echo "$matrix" | grep -qx "$image_major" || { echo "::error::image runs Node $image_major, which no CI job tests"; exit 1; }

      - name: Start the container
        run: docker run -d --name llm-fw-smoke -p 127.0.0.1:8081:8081 -e LLM_FW_GATEWAY_TOKEN=ci-smoke-token llm-fw:ci

      # /readyz answers 503 until the embedding model has loaded, so a 200
      # means the image starts, binds and can scan.
      - name: Wait for the gateway to report ready
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/readyz || true)
            if [ "$code" = "200" ]; then echo "ready after ${i}x2 s"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' llm-fw-smoke)" != "true" ]; then
              echo "::error::container exited before it was ready"; exit 1
            fi
            sleep 2
          done
          echo "::error::gateway never reported ready (last status $code)"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs llm-fw-smoke 2>&1 | tail -100 || true

      # The opt-in lean-ctx build argument (#369): the same version and
      # SHA-256 ci.yml pins. Built from the cached stages, so only the
      # leanctx stage and the runtime copy run again.
      - name: Build the image with lean-ctx
        run: |
          DOCKER_BUILDKIT=1 docker build --progress=plain -t llm-fw:ci-leanctx \
            --build-arg LEAN_CTX_VERSION=3.11.0 \
            --build-arg LEAN_CTX_SHA256=32004ef3e8bea38e8f9b6effcb34ace3243c35a520d39cfc7ebbfce322790c0d .

      # Not just that the binary is there: the module, as the image ships it,
      # starts lean-ctx from PATH and gets a shortened result back.
      - name: The lean-ctx module starts lean-ctx in the container
        run: |
          docker run --rm --entrypoint node -e LLM_FW_DIR=/tmp/llm-fw llm-fw:ci-leanctx --input-type=module -e '
            const { LeanCtxModule } = await import("./dist/modules/builtin/leanCtx.js");
            const { DEFAULT_CONFIG } = await import("./dist/config/config.js");
            const lines = ["[INFO] Scanning for projects..."];
            for (let i = 0; i < 300; i++) lines.push(`[INFO] Downloading from central: https://repo.maven.apache.org/maven2/org/example/lib-${i}/1.0/lib-${i}-1.0.jar`);
            lines.push("[INFO] BUILD SUCCESS");
            const log = lines.join("\n");
            const mod = new LeanCtxModule({ ...structuredClone(DEFAULT_CONFIG.modules.leanCtx), enabled: true, timeoutMs: 30000 });
            const ctx = { target: "api.anthropic.com", method: "POST", path: "/v1/messages", isLlmRequest: true, parser: null };
            const body = JSON.stringify({ messages: [
              { role: "assistant", content: [{ type: "tool_use", id: "t1", name: "Bash", input: { command: "mvn -q verify" } }] },
              { role: "user", content: [{ type: "tool_result", tool_use_id: "t1", content: log }] },
            ] });
            const res = await mod.transformRequest(body, ctx);
            mod.close();
            const out = JSON.parse(res.body).messages[1].content[0].content;
            console.log(`lean-ctx: ${log.length} -> ${out.length} characters`);
            if (!res.modified || out.length >= log.length / 2 || !out.includes("BUILD SUCCESS")) { console.error("the module did not get a shortened result from lean-ctx"); process.exit(1); }
          '

      - name: The default image carries no lean-ctx
        run: |
          if docker run --rm --entrypoint sh llm-fw:ci -c 'command -v lean-ctx'; then
            echo "::error::lean-ctx is in the default image; it is meant to be opt-in"; exit 1
          fi
