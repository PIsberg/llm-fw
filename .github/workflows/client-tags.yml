name: Client Tags

# Claude Code wraps its own text in markup tags (task notifications, command
# output, skill envelopes). The classifier scores a user turn made only of
# those tags for what they carry, from the list in src/detection/clientTags.ts,
# which `npm run client-tags` extracts from a Claude Code build. Three ruleset
# cuts on 2026-10-31 were tags that list did not hold yet, each found because it
# blocked someone. This job reads the newest release every week and fails when
# it adds or drops a tag, so the next one is found here instead.
#
# Codex does the same with its own wrappers (<environment_context>, the
# AGENTS.md envelope). `npm run codex-tags -- --check` reads the tag constants
# from the codex-rs sources of its newest release and fails when one is added
# or gone against scripts/codex-tags.json (#607).
#
# The binary is downloaded with `npm pack` and only read, never run.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/client-tags.ts'
      - 'src/detection/clientTags.ts'
      # The skill listing's wording, which the same check reads from the build.
      - 'src/modules/builtin/toolFilter.ts'
      - 'scripts/codex-tags.ts'
      - 'scripts/codex-tags.json'
      - '.github/workflows/client-tags.yml'

permissions:
  contents: read

jobs:
  check:
    name: Claude Code and Codex tags match the committed lists
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The extractor reads a file with Node and tsx; no native package is
      # needed, and onnxruntime's install script once failed this job on a
      # nuget.org timeout.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the newest Claude Code build
        run: |
          npm pack @anthropic-ai/claude-code-linux-x64@latest --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/anthropic-ai-claude-code-linux-x64-*.tgz -C "$RUNNER_TEMP"

      - name: Compare its tags with the committed list
        run: npm run client-tags -- --from "$RUNNER_TEMP/package/claude" --check

      # Reads source files over HTTPS, never builds or runs Codex.
      - name: Compare Codex's tags with scripts/codex-tags.json
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run codex-tags -- --check
