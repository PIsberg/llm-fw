name: njsscan

on:
  push:
    branches-ignore: [gh-pages, 'dependabot/**']
  pull_request:
    branches-ignore: [gh-pages]

permissions:
  contents: read

jobs:
  njsscan:
    name: Static taint analysis (njsscan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install njsscan
        run: pip install --no-cache-dir njsscan==1.0.2

      - name: Run njsscan
        run: njsscan -c .njsscan . --sarif -o results.sarif

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
