name: njsscan

on:
  push:
    branches-ignore: [gh-pages, 'dependabot/**']
  pull_request:
    branches-ignore: [gh-pages]

permissions:
  contents: read

jobs:
  njsscan:
    name: Static taint analysis (njsscan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install njsscan
        run: pip install --no-cache-dir njsscan==1.0.2

      - name: Run njsscan
        run: njsscan -c .njsscan . --sarif -o results.sarif

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
