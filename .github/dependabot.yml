version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing updates to newly published versions — a
    # newly published package/action can be malicious or unstable.
    #
    # This is also the answer to "why has Dependabot gone quiet?". It has not:
    # it is holding. Check the publish date before concluding anything is
    # broken, because a package released yesterday will not be proposed today.
    cooldown:
      default-days: 7
    # One pull request for the lot. Every action here is already SHA-pinned, so
    # a bump is a SHA swap that stands or falls as a set; eight separate pull
    # requests for that is noise, and noise gets bulk-closed unread. It did:
    # PRs 171-178 were all closed in the same second on 2026-08-11.
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Dev tooling moves constantly and is reviewed as a set: if the suite is
      # green afterwards, the bump did its job. Patch and minor only.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Deliberately NOT grouped, so each arrives as its own pull request:
    #
    #   * the three runtime dependencies. @huggingface/transformers decides
    #     every embedding this firewall produces, so a bump can move cosine
    #     similarities, change verdicts, invalidate the published benchmark
    #     numbers and require a RULESET_VERSION cut. That is not a bump to
    #     skim. node-forge issues the CA. cosmiconfig reads config.
    #   * every major, in either group. vitest and typescript majors change
    #     the tooling that MEASURES detection, which is the one thing here
    #     that must not drift unnoticed.
    #
    # See the `dependencies` skill for what to check before merging either.

  # No pip ecosystem for .github/workflows/semgrep-requirements.txt, on purpose.
  #
  # That file is a fully-resolved lock, not a manifest: semgrep is the only real
  # input and the other 65 entries are pins semgrep itself dictates. Dependabot
  # reads it as a flat requirement list and bumps entries one at a time, which
  # produces installs that cannot resolve — semgrep 1.172.0 hard-pins
  # mcp==1.23.3, so a PR moving mcp to 1.28.1 fails with ResolutionImpossible.
  # Six such PRs appeared within an hour of adding the ecosystem here.
  #
  # Regenerate the whole file with uv instead; the command is in its header.
  # The Semgrep job fails loudly if the lock is ever unsatisfiable.
  #
  # That is not enough on its own, and it cost three high-severity `mcp`
  # advisories sitting open with no pull request to fix them: a lock can
  # resolve perfectly well while pinning a vulnerable transitive dependency,
  # and nothing failed. `.github/workflows/semgrep-lock-freshness.yml` now
  # watches the one input that matters, semgrep's own version, and opens a
  # whole-file regeneration when it moves.
