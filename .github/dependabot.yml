version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Wait 7 days before proposing updates to newly published versions — a
    # newly published package/action can be malicious or unstable.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # The Semgrep workflow installs from a hash-pinned requirements file. Pinning
  # without an update path just means running a frozen scanner, so let
  # Dependabot move the pins. It rewrites the hashes with the versions.
  - package-ecosystem: pip
    directory: /.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
