<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" class="statediagram" style="max-width: 1040px;" viewBox="0 0 1040 860" role="graphics-document document" aria-roledescription="stateDiagram">
  <style>
    #mermaid-svg { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 14px; fill: #333; }
    .transition { stroke: #333333; stroke-width: 1.5; fill: none; }
    .state-start { fill: #333333; stroke: #333333; }
    .state-end-outer { fill: #9370DB; stroke: #333333; stroke-width: 1.5; }
    .state-end-inner { fill: #ffffff; }
    .state-box { fill: #ECECFF; stroke: #9370DB; stroke-width: 1.5px; rx: 6px; ry: 6px; }
    .state-label { fill: #131300; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .edge-bg { fill: rgba(232, 232, 232, 0.88); rx: 4px; ry: 4px; }
    .edge-text { fill: #333333; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
  </style>
  <defs>
    <marker id="barbEnd" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 10,5 L 0,10 L 3,5 L 0,0 Z" fill="#333333" />
    </marker>
  </defs>

  <!-- Edges -->
  <g class="edgePaths">
    <!-- [*] -> ExtractPrompts -->
    <path class="transition" d="M 420,28 L 420,66" marker-end="url(#barbEnd)" />
    <!-- ExtractPrompts -> NoPrompt -->
    <path class="transition" d="M 355,96 L 140,210" marker-end="url(#barbEnd)" />
    <!-- ExtractPrompts -> Normalize -->
    <path class="transition" d="M 465,106 L 540,180" marker-end="url(#barbEnd)" />
    <!-- NoPrompt -> Pass -->
    <path class="transition" d="M 140,250 L 140,560 L 295,560" marker-end="url(#barbEnd)" />
    <!-- Normalize -> Stage1 -->
    <path class="transition" d="M 540,220 L 540,295" marker-end="url(#barbEnd)" />
    <!-- Stage1 -> Block (score >= 50) -->
    <path class="transition" d="M 540,335 L 540,540" marker-end="url(#barbEnd)" />
    <!-- Stage1 -> Stage2 (20 <= score < 50) -->
    <path class="transition" d="M 595,315 L 760,410" marker-end="url(#barbEnd)" />
    <!-- Stage1 -> Pass (score < 20) -->
    <path class="transition" d="M 485,315 L 340,540" marker-end="url(#barbEnd)" />
    <!-- Stage2 -> Block (max_similarity >= 0.86) -->
    <path class="transition" d="M 720,450 L 575,540" marker-end="url(#barbEnd)" />
    <!-- Stage2 -> Warn (0.80 <= max_similarity < 0.86) -->
    <path class="transition" d="M 795,450 L 890,540" marker-end="url(#barbEnd)" />
    <!-- Stage2 -> Pass (max_similarity < 0.80) -->
    <path class="transition" d="M 705,435 L 385,550" marker-end="url(#barbEnd)" />
    <!-- Block -> Withhold (tool result, onBlock=withhold & earlier user message, olderTurns=withhold) -->
    <path class="transition" d="M 585,560 L 735,660" marker-end="url(#barbEnd)" />
    <!-- Withhold -> Normalize (rescan with a notice in its place) -->
    <path class="transition" d="M 830,660 C 995,620 995,200 600,200" marker-end="url(#barbEnd)" />
    <!-- Warn -> JudgeAsync -->
    <path class="transition" d="M 865,580 L 340,685" marker-end="url(#barbEnd)" />
    <!-- Pass -> JudgeAsync -->
    <path class="transition" d="M 320,580 L 280,665" marker-end="url(#barbEnd)" />
    <!-- JudgeAsync -> [*] -->
    <path class="transition" d="M 280,705 L 525,815" marker-end="url(#barbEnd)" />
    <!-- Block -> [*] -->
    <path class="transition" d="M 540,580 L 540,805" marker-end="url(#barbEnd)" />
    <!-- Pass -> [*] -->
    <path class="transition" d="M 355,580 L 530,810" marker-end="url(#barbEnd)" />
    <!-- Warn -> [*] -->
    <path class="transition" d="M 900,580 L 555,815" marker-end="url(#barbEnd)" />
  </g>

  <!-- Edge Labels -->
  <g class="edgeLabels">
    <g transform="translate(230, 148)">
      <rect class="edge-bg" x="-78" y="-11" width="156" height="22" />
      <text class="edge-text">no user content found</text>
    </g>
    <g transform="translate(520, 142)">
      <rect class="edge-bg" x="-66" y="-11" width="132" height="22" />
      <text class="edge-text">prompts extracted</text>
    </g>
    <g transform="translate(140, 405)">
      <rect class="edge-bg" x="-84" y="-11" width="168" height="22" />
      <text class="edge-text">pass through untouched</text>
    </g>
    <g transform="translate(540, 435)">
      <rect class="edge-bg" x="-42" y="-11" width="84" height="22" />
      <text class="edge-text">score ≥ 50</text>
    </g>
    <g transform="translate(690, 355)">
      <rect class="edge-bg" x="-58" y="-11" width="116" height="22" />
      <text class="edge-text">20 ≤ score &lt; 50</text>
    </g>
    <g transform="translate(395, 420)">
      <rect class="edge-bg" x="-42" y="-11" width="84" height="22" />
      <text class="edge-text">score &lt; 20</text>
    </g>
    <g transform="translate(650, 495)">
      <rect class="edge-bg" x="-78" y="-11" width="156" height="22" />
      <text class="edge-text">max_similarity ≥ 0.86</text>
    </g>
    <g transform="translate(865, 495)">
      <rect class="edge-bg" x="-102" y="-11" width="204" height="22" />
      <text class="edge-text">0.80 ≤ max_similarity &lt; 0.86</text>
    </g>
    <g transform="translate(540, 488)">
      <rect class="edge-bg" x="-78" y="-11" width="156" height="22" />
      <text class="edge-text">max_similarity &lt; 0.80</text>
    </g>
    <g transform="translate(715, 605)">
      <rect class="edge-bg" x="-168" y="-20" width="336" height="40" />
      <text class="edge-text" y="-8">the item is a tool result, onBlock=withhold</text>
      <text class="edge-text" y="9">the item is an earlier user message, olderTurns=withhold</text>
    </g>
    <g transform="translate(895, 360)">
      <rect class="edge-bg" x="-105" y="-11" width="210" height="22" />
      <text class="edge-text">rescan with a notice in its place</text>
    </g>
    <g transform="translate(250, 622)">
      <rect class="edge-bg" x="-112" y="-11" width="224" height="22" />
      <text class="edge-text">judgeEnabled=true, judgeBlock=false</text>
    </g>
    <g transform="translate(370, 765)">
      <rect class="edge-bg" x="-88" y="-11" width="176" height="22" />
      <text class="edge-text">verdict logged post-facto</text>
    </g>
    <g transform="translate(540, 715)">
      <rect class="edge-bg" x="-92" y="-11" width="184" height="22" />
      <text class="edge-text">HTTP 422 + dashboard event</text>
    </g>
    <g transform="translate(435, 680)">
      <rect class="edge-bg" x="-72" y="-11" width="144" height="22" />
      <text class="edge-text">forward to upstream</text>
    </g>
    <g transform="translate(745, 735)">
      <rect class="edge-bg" x="-95" y="-11" width="190" height="22" />
      <text class="edge-text">forward + dashboard warning</text>
    </g>
  </g>

  <!-- Nodes -->
  <g class="nodes">
    <circle class="state-start" cx="420" cy="20" r="8" />

    <g transform="translate(420, 86)">
      <rect class="state-box" x="-65" y="-20" width="130" height="40" />
      <text class="state-label">ExtractPrompts</text>
    </g>

    <g transform="translate(140, 230)">
      <rect class="state-box" x="-52" y="-20" width="104" height="40" />
      <text class="state-label">NoPrompt</text>
    </g>

    <g transform="translate(540, 200)">
      <rect class="state-box" x="-55" y="-20" width="110" height="40" />
      <text class="state-label">Normalize</text>
    </g>

    <g transform="translate(540, 315)">
      <rect class="state-box" x="-48" y="-20" width="96" height="40" />
      <text class="state-label">Stage1</text>
    </g>

    <g transform="translate(760, 430)">
      <rect class="state-box" x="-48" y="-20" width="96" height="40" />
      <text class="state-label">Stage2</text>
    </g>

    <g transform="translate(340, 560)">
      <rect class="state-box" x="-42" y="-20" width="84" height="40" />
      <text class="state-label">Pass</text>
    </g>

    <g transform="translate(540, 560)">
      <rect class="state-box" x="-45" y="-20" width="90" height="40" />
      <text class="state-label">Block</text>
    </g>

    <g transform="translate(900, 560)">
      <rect class="state-box" x="-42" y="-20" width="84" height="40" />
      <text class="state-label">Warn</text>
    </g>

    <g transform="translate(780, 680)">
      <rect class="state-box" x="-52" y="-20" width="104" height="40" />
      <text class="state-label">Withhold</text>
    </g>

    <g transform="translate(280, 685)">
      <rect class="state-box" x="-58" y="-20" width="116" height="40" />
      <text class="state-label">JudgeAsync</text>
    </g>

    <g transform="translate(540, 820)">
      <circle class="state-end-outer" cx="0" cy="0" r="9" />
      <circle class="state-end-inner" cx="0" cy="0" r="4" />
    </g>
  </g>
</svg>
